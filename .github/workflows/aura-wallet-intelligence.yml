name: AURA Wallet Intelligence checks
on:
  push:
    branches: [feat/aura-wallet-watch-only-v0.1]
    paths:
      - "wallet-intelligence/**"
      - "wallet-intelligence-api/**"
      - ".github/workflows/aura-wallet-intelligence.yml"
  pull_request:
    branches: [crypto-signal-lab]
    paths:
      - "wallet-intelligence/**"
      - ".github/workflows/aura-wallet-intelligence.yml"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse application JavaScript
        run: node --check wallet-intelligence/app.js
      - name: Parse market client and API JavaScript
        run: |
          node --check wallet-intelligence/market.js
          node --check wallet-intelligence-api/server.mjs
          node --check wallet-intelligence/intelligence-core.mjs
          node --check wallet-intelligence/intelligence-ui.mjs
      - name: Run watch-only and privacy tests
        run: node --test wallet-intelligence/tests/*.test.mjs
